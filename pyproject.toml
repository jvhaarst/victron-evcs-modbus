[project]
name = "victron-evcs-modbus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymodbus>=3.10",   # device_id= kwarg (was slave=) lands in 3.10.0
    "rich>=13.0",
    "textual>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "openpyxl>=3.1.5",
]

[project.scripts]
evcs = "cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

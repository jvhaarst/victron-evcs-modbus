[project]
name = "victron-evcs-modbus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymodbus>=3.7",
    "rich>=13.0",
    "textual>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
]

[project.scripts]
evcs-reader = "reader:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
